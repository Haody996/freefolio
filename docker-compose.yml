services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: freefolio
      POSTGRES_USER: freefolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    ports:
      # Host 8090 → container 8000 (8000 is jobsclaw, 8080 is mealplanner). Host
      # nginx proxies getfreefolio.com to 127.0.0.1:8090.
      - "8090:8000"
    env_file: .env
    environment:
      PORT: "8000"
      NODE_ENV: production
      DATABASE_URL: postgresql://freefolio:${POSTGRES_PASSWORD:-changeme123}@postgres:5432/freefolio
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # Fetches latest market prices for all tracked holding symbols on a schedule.
  price-refresh-worker:
    build:
      context: .
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    command: node dist/workers/price-refresh-worker.js
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://freefolio:${POSTGRES_PASSWORD:-changeme123}@postgres:5432/freefolio
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # Computes each user's daily net-worth snapshot (assets − liabilities).
  networth-snapshot-worker:
    build:
      context: .
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    command: node dist/workers/networth-snapshot-worker.js
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://freefolio:${POSTGRES_PASSWORD:-changeme123}@postgres:5432/freefolio
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

volumes:
  postgres_data:
